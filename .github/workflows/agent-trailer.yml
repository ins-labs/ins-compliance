name: agent-trailer-check
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/agent_trailer_check.py --event-path "$GITHUB_EVENT_PATH"
